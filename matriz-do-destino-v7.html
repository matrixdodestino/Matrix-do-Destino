<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matriz do Destino — Calculadora e Interpretação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#07061A; --deep:#0F0A2B; --panel:#150E3A;
    --nebula:#2A1A5E; --indigo:#3B2A86;
    --electric:#5B8DEF; --violet:#9D7BFF; --lilac:#C7B4FF;
    --starlight:#ECE8FF; --muted:#8E86BE; --line:rgba(157,123,255,.22);
    --glow:rgba(157,123,255,.55); --coral:#FF9E7D; --age:#B9B0E6;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; color:var(--starlight); font-family:"EB Garamond",Georgia,serif;
    font-size:18px; line-height:1.7;
    background:
      radial-gradient(1200px 700px at 50% -8%, #221452 0%, rgba(34,20,82,0) 60%),
      radial-gradient(900px 600px at 12% 108%, #14224f 0%, rgba(20,34,79,0) 55%),
      radial-gradient(900px 600px at 92% 4%, #34155a 0%, rgba(52,21,90,0) 55%),
      linear-gradient(180deg, var(--void), #060414 70%);
    background-attachment:fixed; min-height:100vh; overflow-x:hidden;
  }
  #stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .wrap{position:relative; z-index:1; max-width:920px; margin:0 auto; padding:clamp(28px,5vw,64px) 20px 80px;}

  .eyebrow{font-family:"Cinzel",serif; letter-spacing:.42em; text-transform:uppercase;
    font-size:12px; color:var(--lilac); opacity:.8; margin:0 0 18px;}
  h1{font-family:"Cinzel",serif; font-weight:500; letter-spacing:.02em;
    font-size:clamp(34px,7vw,62px); line-height:1.04; margin:0 0 10px;
    background:linear-gradient(180deg,#fff, var(--lilac) 70%, var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .lede{font-family:"Cormorant Garamond",serif; font-size:clamp(19px,2.4vw,24px);
    font-style:italic; color:var(--muted); max-width:46ch; margin:0;}

  .card{background:linear-gradient(180deg, rgba(30,20,66,.72), rgba(16,10,40,.72));
    border:1px solid var(--line); border-radius:18px; padding:26px;
    box-shadow:0 30px 80px -40px #000, inset 0 1px 0 rgba(199,180,255,.08);
    backdrop-filter:blur(6px);}

  .form{margin-top:34px;}
  .form-row{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;}
  .field{flex:1 1 120px; min-width:110px;}
  .field.name{flex:1 1 100%;}
  label{display:block; font-family:"Cinzel",serif; font-size:11px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--lilac); opacity:.85; margin:0 0 8px;}
  select,input[type=text]{width:100%; font-family:"EB Garamond",serif; font-size:17px;
    color:var(--starlight); background:rgba(8,6,26,.8); border:1px solid var(--line);
    border-radius:11px; padding:12px 13px; appearance:none; outline:none; transition:border-color .2s,box-shadow .2s;}
  select:focus,input:focus{border-color:var(--violet); box-shadow:0 0 0 3px rgba(157,123,255,.22);}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--lilac) 50%),linear-gradient(135deg,var(--lilac) 50%,transparent 50%);
    background-position:calc(100% - 18px) 20px,calc(100% - 12px) 20px; background-size:6px 6px,6px 6px; background-repeat:no-repeat;}
  option{background:#0F0A2B;}

  .btn{margin-top:20px; width:100%; font-family:"Cinzel",serif; font-weight:500;
    letter-spacing:.16em; text-transform:uppercase; font-size:14px; color:#0b0720;
    background:linear-gradient(180deg,var(--lilac),var(--violet)); border:none; cursor:pointer;
    padding:15px 18px; border-radius:12px; transition:transform .15s, box-shadow .2s;
    box-shadow:0 12px 40px -12px var(--glow);}
  .btn:hover{transform:translateY(-1px); box-shadow:0 18px 50px -12px var(--glow);}
  .btn:active{transform:translateY(0);}
  .err{color:#FF9BB0; font-style:italic; margin:12px 2px 0; min-height:1.2em; font-size:15px;}

  /* result */
  #result{margin-top:44px; opacity:0; transform:translateY(14px); transition:opacity .7s, transform .7s;}
  #result.show{opacity:1; transform:none;}
  .result-name{font-family:"Cormorant Garamond",serif; font-style:italic; text-align:center;
    color:var(--lilac); font-size:22px; margin:0 0 4px;}
  .result-title{font-family:"Cinzel",serif; text-align:center; font-size:14px; letter-spacing:.3em;
    text-transform:uppercase; color:var(--muted); margin:0 0 22px;}

  .chart-shell{position:relative;}
  svg#octagrama{width:100%; height:auto; display:block; overflow:visible;}
  .node-hit{cursor:pointer;}
  .node-circ{transition:filter .2s, stroke-width .2s;}
  .node-hit:hover .node-circ{filter:drop-shadow(0 0 8px var(--glow));}
  .node-hit.active .node-circ{stroke:#fff; stroke-width:2.4;}
  .node-num{font-family:"Cinzel",serif; fill:var(--starlight); text-anchor:middle; dominant-baseline:central; pointer-events:none;}
  .age-label{font-family:"EB Garamond",serif; fill:var(--muted); text-anchor:middle; dominant-baseline:central; font-size:9px; pointer-events:none;}
  .glyph-line{fill:none; stroke:var(--line); stroke-width:1;}
  .glyph-line.strong{stroke:rgba(157,123,255,.4);}
  .gen-line{fill:none; stroke-width:1.4; opacity:.55;}

  .hint{font-family:"Cormorant Garamond",serif; font-style:italic; text-align:center;
    color:var(--muted); font-size:16px; margin:14px 0 0;}

  /* detail panel */
  #detail{margin-top:26px; min-height:20px;}
  .arc-card{border-left:2px solid var(--violet); padding:4px 0 4px 20px;}
  .arc-zone{font-family:"Cinzel",serif; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--lilac);}
  .arc-head{font-family:"Cormorant Garamond",serif; font-size:29px; font-weight:600; color:#fff; margin:4px 0 2px; line-height:1.1;}
  .arc-sub{font-family:"Cormorant Garamond",serif; font-style:italic; color:var(--muted); font-size:18px; margin:0 0 12px;}
  .arc-body{margin:0; color:var(--starlight);}

  /* zone summary list */
  .zones{margin-top:38px;}
  .zones h2{font-family:"Cinzel",serif; font-weight:500; font-size:15px; letter-spacing:.26em;
    text-transform:uppercase; color:var(--lilac); text-align:center; margin:0 0 20px;}
  .zone-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px;}
  .zone-item{background:rgba(12,8,32,.55); border:1px solid var(--line); border-radius:13px; padding:15px 16px; cursor:pointer; transition:border-color .2s, background .2s;}
  .zone-item:hover{border-color:var(--violet); background:rgba(24,15,56,.7);}
  .zone-item .zn{font-family:"Cinzel",serif; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted);}
  .zone-item .zv{display:flex; align-items:baseline; gap:9px; margin-top:5px;}
  .zone-item .num{font-family:"Cinzel",serif; font-size:26px; color:var(--lilac);}
  .zone-item .arc{font-family:"Cormorant Garamond",serif; font-style:italic; font-size:18px; color:var(--starlight);}

  footer{margin-top:56px; text-align:center; color:var(--muted); font-family:"Cormorant Garamond",serif; font-style:italic; font-size:15px;}
  footer b{color:var(--lilac); font-style:normal; font-family:"Cinzel",serif; font-weight:400; letter-spacing:.2em; font-size:12px;}

  @media (max-width:560px){
    body{font-size:17px;}
    .card{padding:20px;}
    .field{flex:1 1 90px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <p class="eyebrow">@matrizdodestino</p>
  <h1>Matriz do Destino</h1>
  <p class="lede">O octograma dos 22 arcanos, calculado a partir da sua data de nascimento.</p>

  <div class="card form">
    <div class="form-row">
      <div class="field">
        <label for="dia">Dia</label>
        <select id="dia"></select>
      </div>
      <div class="field">
        <label for="mes">Mês</label>
        <select id="mes"></select>
      </div>
      <div class="field">
        <label for="ano">Ano</label>
        <select id="ano"></select>
      </div>
    </div>
    <div class="form-row" style="margin-top:14px;">
      <div class="field name">
        <label for="nome">Nome <span style="opacity:.5;text-transform:none;letter-spacing:normal;font-family:'Cormorant Garamond';font-style:italic">(opcional)</span></label>
        <input type="text" id="nome" placeholder="para personalizar a leitura" autocomplete="off">
      </div>
    </div>
    <button class="btn" id="go">Revelar o mapa</button>
    <p class="err" id="err"></p>
  </div>

  <div id="result">
    <p class="result-name" id="rname"></p>
    <p class="result-title" id="rtitle">Seu octograma</p>
    <div class="chart-shell card" style="padding:14px;">
      <svg id="octagrama" viewBox="0 0 680 740" role="img" aria-label="Octograma da Matriz do Destino"></svg>
    </div>
    <p class="hint">Toque em qualquer energia do mapa para ler seu arcano.</p>
    <div id="detail"></div>

    <div class="zones">
      <h2>As zonas do seu mapa</h2>
      <div class="zone-grid" id="zoneGrid"></div>
    </div>

    <footer>
      <b>@matrizdodestino</b><br>
      Método Natalia Ladini · 22 Arcanos Maiores
    </footer>
  </div>
</div>

<script>
/* ============ MOTOR DE CÁLCULO (método Ladini, validado) ============ */
function reduzir(n){ while(n>22){ n=String(n).split('').reduce((a,d)=>a+Number(d),0);} return n; }
function somaDig(n){ return String(n).split('').reduce((a,d)=>a+Number(d),0); }

function calcular(dia,mes,ano){
  const D=reduzir(dia), M=reduzir(mes), A=reduzir(somaDig(ano));
  const SUM=reduzir(D+M+A);
  const centro=reduzir(D+M+A+SUM);
  const NW=reduzir(D+M), NE=reduzir(M+A), SE=reduzir(A+SUM), SW=reduzir(SUM+D);
  // cauda de cada ponta: [interno = red(centro+ponta), externo = red(interno+ponta)]
  const cauda=tip=>{const inner=reduzir(centro+tip); return {inner, outer:reduzir(inner+tip)};};
  const N=cauda(M), E=cauda(A), Sd=cauda(SUM), W=cauda(D);
  const cNW=cauda(NW), cNE=cauda(NE), cSE=cauda(SE), cSW=cauda(SW);
  // pontos verdes (anel próximo ao centro) = red(interno + centro)
  const gN=reduzir(N.inner+centro), gE=reduzir(E.inner+centro),
        gS=reduzir(Sd.inner+centro), gW=reduzir(W.inner+centro);
  // linha do amor & dinheiro: liga o interno horizontal (E) ao interno vertical (S)
  const lmMid=reduzir(E.inner+Sd.inner);
  const money=reduzir(E.inner+lmMid);   // $  (lado E)
  const love =reduzir(lmMid+Sd.inner);  // ❤  (lado S)
  return {D,M,A,SUM,centro,NW,NE,SE,SW,N,E,S:Sd,W,
          cNW,cNE,cSE,cSW, green:{N:gN,E:gE,S:gS,W:gW},
          lm:{money, mid:lmMid, love}};
}

/* ============ ARCANOS 1–22 ============ */
const ARCANOS={
 1:["O Mago","transforma intenção em realidade","A força de quem faz do pensamento matéria. Seu dom é a iniciativa e a palavra que cria; sua sombra é a dispersão e a manipulação. A lição é usar o próprio poder com verdade."],
 2:["A Sacerdotisa","o saber que vem de dentro","O conhecimento que existe antes de qualquer explicação. Seu dom é a intuição e o mistério; sua sombra, o isolamento e o segredo que adoece. A lição é confiar na própria voz interior."],
 3:["A Imperatriz","a abundância que acolhe e cria","A fartura que nasce quando você se permite criar e receber. Seu dom é a fertilidade das ideias e o senso de beleza; sua sombra, o excesso e a acomodação. A lição é nutrir sem se anular."],
 4:["O Imperador","a estrutura que sustenta o sonho","A ordem que dá chão àquilo que se deseja construir. Seu dom é a autoridade e a disciplina; sua sombra, a rigidez e o controle. A lição é liderar sem endurecer."],
 5:["O Hierofante","a ponte entre o sagrado e o comum","A tradução do sagrado para o cotidiano. Seu dom é o ensino e a fé em algo maior; sua sombra, o dogma e a dependência de aprovação. A lição é encontrar a própria verdade espiritual."],
 6:["Os Enamorados","a arte da escolha e do encontro","A união que floresce quando opostos se reconhecem. Seu dom é a harmonia e o afeto; sua sombra, a indecisão e a busca de completude no outro. A lição é escolher com o coração inteiro."],
 7:["O Carro","o impulso que vence a resistência","A vontade que avança mesmo contra a corrente. Seu dom é a direção e a determinação; sua sombra, a pressa e a guerra interna. A lição é conduzir forças opostas rumo a um mesmo destino."],
 8:["A Justiça","o equilíbrio que devolve cada gesto","A balança que responde a cada ação com sua consequência. Seu dom é a clareza e a integridade; sua sombra, o julgamento frio e a culpa. A lição é agir com honestidade e aceitar o que retorna."],
 9:["O Eremita","a luz encontrada no silêncio","A sabedoria que se acende quando o barulho cessa. Seu dom é a introspecção e o discernimento; sua sombra, a solidão que se fecha. A lição é iluminar o próprio caminho e depois partilhar a chama."],
 10:["A Roda da Fortuna","o movimento eterno dos ciclos","O giro perpétuo que tudo transforma. Seu dom é a capacidade de recomeçar e fluir com a mudança; sua sombra, sentir-se à mercê da sorte. A lição é girar com a roda em vez de resistir a ela."],
 11:["A Força","a coragem serena que doma o instinto","O poder que se exerce pela ternura, não pela dureza. Seu dom é a resistência interior e a paixão; sua sombra, o orgulho e a força voltada contra si. A lição é vencer com suavidade."],
 12:["O Enforcado","a entrega que revela outro ângulo","A pausa que inverte a perspectiva e revela o oculto. Seu dom é a rendição sábia e a paciência; sua sombra, o sacrifício estéril e a estagnação. A lição é soltar para enfim enxergar."],
 13:["A Transformação","o fim que abre espaço ao novo","O encerramento necessário para que a vida se renove. Seu dom é a renovação profunda e o desapego; sua sombra, o apego ao que já morreu. A lição é deixar ir com reverência."],
 14:["A Temperança","a alquimia dos opostos","A mistura paciente que cura e reconcilia. Seu dom é o equilíbrio e a moderação; sua sombra, a mornidão e a impaciência. A lição é encontrar a justa medida entre os extremos."],
 15:["O Diabo","o espelho dos desejos e das prisões","O reflexo daquilo que seduz e aprisiona. Seu dom é a força magnética e a sensualidade; sua sombra, o vício e as amarras que você mesma criou. A lição é reconhecer as próprias correntes para poder soltá-las."],
 16:["A Torre","o raio que derruba o que é falso","A ruptura súbita que desfaz o que não se sustentava. Seu dom é a libertação e a verdade que desperta; sua sombra, viver o colapso como catástrofe. A lição é deixar ruir o que era ilusão."],
 17:["A Estrela","a esperança que renasce após a queda","A serenidade que retorna depois da tempestade. Seu dom é a fé, a inspiração e a cura; sua sombra, a idealização e a fuga do real. A lição é confiar no fluxo sem perder o chão."],
 18:["A Lua","o território dos sonhos e do oculto","O reino do que não se vê à luz do dia. Seu dom é a sensibilidade e a imaginação; sua sombra, a ilusão e o medo que distorce. A lição é atravessar a escuridão sem se perder nela."],
 19:["O Sol","a alegria que ilumina tudo","O calor que aquece e revela com clareza. Seu dom é a vitalidade e a autenticidade; sua sombra, a vaidade e o brilho que ofusca. A lição é brilhar sem precisar de plateia."],
 20:["O Julgamento","o chamado que desperta","O convite a renascer para uma nova vida. Seu dom é a renovação e o discernimento; sua sombra, a autocrítica implacável. A lição é responder ao chamado sem se condenar."],
 21:["O Mundo","a realização de um ciclo inteiro","A plenitude de quem integrou todas as partes. Seu dom é a completude e a maestria; sua sombra, a dificuldade de concluir e seguir. A lição é celebrar a conquista e abrir-se ao próximo círculo."],
 22:["O Louco","a liberdade de recomeçar sem medo","O salto confiante rumo ao desconhecido. Seu dom é a espontaneidade e a fé na jornada; sua sombra, a inconsequência e a fuga. A lição é dar o passo com o coração leve e os olhos abertos."]
};

/* ============ LAYOUT DO OCTOGRAMA ============ */
const CX=340, CY=350, RO=236;
const P={
  N:[CX,CY-RO], E:[CX+RO,CY], S:[CX,CY+RO], W:[CX-RO,CY],
  NW:[CX-RO/Math.SQRT2, CY-RO/Math.SQRT2], NE:[CX+RO/Math.SQRT2, CY-RO/Math.SQRT2],
  SE:[CX+RO/Math.SQRT2, CY+RO/Math.SQRT2], SW:[CX-RO/Math.SQRT2, CY+RO/Math.SQRT2],
  C:[CX,CY]
};
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
const NIN=P=>lerp([CX,CY],P,0.34), NOUT=P=>lerp([CX,CY],P,0.72);

/* ============ CONSTRUÇÃO ============ */
// posições da cauda ao longo do raio: ponta(1.0) -> externo(0.84) -> interno(0.70)
const F_TIP=1.0, F_OUT=0.84, F_IN=0.70, F_GREEN=0.30;
function buildNodes(r){
  const nodes=[];
  const add=(pos,val,size,zone,zsub,variant)=>nodes.push({x:pos[0],y:pos[1],val,size,zone,zsub,variant:variant||'plain'});
  const at=(dir,f)=>lerp([CX,CY],P[dir],f);
  // centro
  add(P.C, r.centro, 'xl', "Essência Central", "sua missão e o eixo de tudo", 'center');

  // caudas cardeais (ponta grande, externo médio, interno pequeno)
  const card=[
    ['N', r.M, r.N, "Talento Interior", "o dom que você herdou", 'core'],
    ['E', r.A, r.E, "Missão Social", "sua relação com o mundo material", 'core'],
    ['S', r.SUM, r.S, "Cauda Kármica", "o que você traz de outras vidas", 'core'],
    ['W', r.D, r.W, "Retrato Pessoal", "como você se mostra ao mundo", 'core']
  ];
  card.forEach(([dir,tip,c,zone,zsub,variant])=>{
    add(at(dir,F_TIP), tip, 'lg', zone, zsub, variant);
    add(at(dir,F_OUT), c.outer, 'md', zone+" · cauda", "o desdobrar dessa energia", 'tailmed');
    add(at(dir,F_IN),  c.inner, 'sm', zone+" · cauda", "a raiz dessa energia", 'tailsm');
  });

  // caudas dos cantos (quadrado ancestral)
  const corn=[
    ['NW', r.NW, r.cNW, "Ancestral Paterno", "herança da linha masculina"],
    ['NE', r.NE, r.cNE, "Ancestral Materno", "herança da linha feminina"],
    ['SE', r.SE, r.cSE, "Raiz Paterna", "a base profunda da linha masculina"],
    ['SW', r.SW, r.cSW, "Raiz Materna", "a base profunda da linha feminina"]
  ];
  corn.forEach(([dir,tip,c,zone,zsub])=>{
    add(at(dir,F_TIP), tip, 'lg', zone, zsub, 'corner');
    add(at(dir,F_OUT), c.outer, 'md', zone+" · cauda", "o desdobrar dessa herança", 'tailmed');
    add(at(dir,F_IN),  c.inner, 'sm', zone+" · cauda", "a raiz dessa herança", 'tailsm');
  });

  // anel verde (próximo ao centro): apenas os pontos de cima e da esquerda
  add(at('N',F_GREEN), r.green.N, 'md', "Propósito Espiritual", "o Céu — seu chamado maior", 'green');
  add(at('W',F_GREEN), r.green.W, 'md', "Propósito Pessoal", "seu eixo de conforto e essência", 'green');

  // linha do amor & dinheiro (entre o interno de E e o interno de S)
  const eInP=at('E',F_IN), sInP=at('S',F_IN);
  add(lerp(eInP,sInP,0.25), r.lm.money, 'md', "Linha do Dinheiro", "carreira, prosperidade e recursos", 'money');
  add(lerp(eInP,sInP,0.50), r.lm.mid,  'sm', "Eixo Amor–Dinheiro", "o equilíbrio entre dar e receber", 'lmmid');
  add(lerp(eInP,sInP,0.75), r.lm.love, 'md', "Linha do Amor", "relacionamentos, afeto e vínculos", 'love');
  return nodes;
}

/* ciclos de idade — perímetro
   cada década é subdividida em 8 (uma marca a cada 1,25 ano);
   cada ponto = redução da soma dos dois vizinhos. Assim toda idade tem seu arcano. */
function buildPerimeter(r){
  const seq=[ ['W',r.D,0], ['NW',r.NW,10], ['N',r.M,20], ['NE',r.NE,30],
              ['E',r.A,40], ['SE',r.SE,50], ['S',r.SUM,60], ['SW',r.SW,70] ];
  const ticks=[];
  for(let i=0;i<seq.length;i++){
    const a=seq[i], b=seq[(i+1)%seq.length];
    const pa=P[a[0]], pb=P[b[0]];
    const v=new Array(9);
    v[0]=a[1]; v[8]=b[1];
    v[4]=reduzir(v[0]+v[8]);
    v[2]=reduzir(v[0]+v[4]); v[6]=reduzir(v[4]+v[8]);
    v[1]=reduzir(v[0]+v[2]); v[3]=reduzir(v[2]+v[4]);
    v[5]=reduzir(v[4]+v[6]); v[7]=reduzir(v[6]+v[8]);
    for(let k=0;k<8;k++){
      const age=a[2]+k*1.25;
      const kind = k===0?'decade' : (k===4?'half':'fine');
      ticks.push({p:lerp(pa,pb,k/8), val:v[k], age, kind});
    }
  }
  return ticks;
}
const fmtAge=a=>Number.isInteger(a)?String(a):String(a).replace('.',',');
const faixa=a=>{const f=Math.floor(a); return f+'–'+(f+1);};

/* ============ RENDER SVG ============ */
const svg=document.getElementById('octagrama');
const SVGNS="http://www.w3.org/2000/svg";
function el(tag,attrs){const e=document.createElementNS(SVGNS,tag); for(const k in attrs)e.setAttribute(k,attrs[k]); return e;}
const sizeMap={xl:26, lg:23, md:16, sm:12, xs:9};
const numSize={xl:22, lg:19, md:14, sm:11, xs:8};

function render(r){
  svg.innerHTML="";
  // --- linhas de estrutura ---
  const poly=(pts,cls)=>{const p=el('polygon',{points:pts.map(k=>P[k].join(',')).join(' '),class:'glyph-line '+(cls||'')}); svg.appendChild(p);};
  poly(['N','E','S','W'],'strong');            // quadrado reto (diamante)
  poly(['NW','NE','SE','SW'],'strong');        // quadrado diagonal
  // losango verde interno (anel próximo ao centro)
  const gp=d=>lerp([CX,CY],P[d],F_GREEN);
  const li=el('polygon',{points:[gp('N'),gp('E'),gp('S'),gp('W')].map(p=>p.join(',')).join(' '),class:'glyph-line'});
  svg.appendChild(li);
  // eixos (braços) do centro aos vértices
  ['N','E','S','W'].forEach(k=>svg.appendChild(el('line',{x1:CX,y1:CY,x2:P[k][0],y2:P[k][1],class:'glyph-line'})));
  // linhas geracionais coloridas centro->cantos
  const genColors={NW:'var(--violet)',SE:'var(--violet)',NE:'var(--electric)',SW:'var(--electric)'};
  ['NW','NE','SE','SW'].forEach(k=>svg.appendChild(el('line',{x1:CX,y1:CY,x2:P[k][0],y2:P[k][1],class:'gen-line',stroke:genColors[k]})));
  // linha do amor & dinheiro (tracejada) ligando interno-E a interno-S
  const eIn=lerp([CX,CY],P.E,F_IN), sIn=lerp([CX,CY],P.S,F_IN);
  svg.appendChild(el('line',{x1:eIn[0],y1:eIn[1],x2:sIn[0],y2:sIn[1],
    fill:'none',stroke:'var(--lilac)','stroke-width':1.2,'stroke-dasharray':'3 4',opacity:.55}));
  // símbolos $ e ❤ ao lado dos respectivos pontos
  const mPt=lerp(eIn,sIn,0.25), lPt=lerp(eIn,sIn,0.75);
  const money$=lerp([CX,CY],mPt,1.34);
  const t$=el('text',{x:money$[0],y:money$[1],style:'font-size:20px;fill:#6FE3A6;font-family:"Cinzel",serif;text-anchor:middle;dominant-baseline:central;font-weight:600'}); t$.textContent='$'; svg.appendChild(t$);
  const heartP=lerp([CX,CY],lPt,1.34);
  const th=el('text',{x:heartP[0],y:heartP[1],style:'font-size:17px;text-anchor:middle;dominant-baseline:central'}); th.textContent='❤'; th.setAttribute('fill','#FF6E8A'); svg.appendChild(th);

  // --- perímetro: ciclos de idade ---
  // anel octogonal sutil onde as idades se apoiam
  const ringPts=['W','NW','N','NE','E','SE','S','SW'].map(k=>P[k].join(',')).join(' ');
  svg.appendChild(el('polygon',{points:ringPts, fill:'none', stroke:'var(--line)', 'stroke-width':1, opacity:.4}));
  const peri=buildPerimeter(r);
  peri.forEach(m=>{
    const lp=lerp([CX,CY],m.p,1.10);   // arcano logo fora do anel
    const ap=lerp([CX,CY],m.p,1.185);  // idade mais afora
    if(m.kind==='decade'){
      // idade da década, grande
      const t=el('text',{x:ap[0],y:ap[1],class:'age-label',style:'font-size:12.5px;fill:var(--lilac);opacity:.95;font-family:"Cinzel",serif'});
      t.textContent=fmtAge(m.age)+' anos'; svg.appendChild(t);
      // arcano da idade (na décadaé o próprio nó da ponta) — marca coral pequena
      const a=el('text',{x:lp[0],y:lp[1],class:'age-label',style:'font-size:10px;fill:var(--coral);opacity:.9'});
      a.textContent=m.val; svg.appendChild(a);
    } else {
      // ponto na borda
      const isHalf=m.kind==='half';
      svg.appendChild(el('circle',{cx:m.p[0],cy:m.p[1],r:isHalf?3:2,fill:isHalf?'var(--lilac)':'var(--muted)',opacity:isHalf?.9:.6}));
      // arcano (coral, destacado) — em TODA marca
      const a=el('text',{x:lp[0],y:lp[1],class:'age-label',style:'font-size:'+(isHalf?11:9)+'px;fill:var(--coral);opacity:'+(isHalf?.95:.82)});
      a.textContent=m.val; svg.appendChild(a);
      // idade: "X anos" nas de 5; faixa "n–n+1" nas finas
      const t=el('text',{x:ap[0],y:ap[1],class:'age-label',style:'font-size:'+(isHalf?9.5:7)+'px;fill:var(--age);opacity:'+(isHalf?.9:.62)});
      t.textContent = isHalf ? (fmtAge(m.age)+' anos') : faixa(m.age);
      svg.appendChild(t);
    }
  });

  // --- nós principais ---
  const nodes=buildNodes(r);
  const V={
    center:{fill:'url(#gCenter)', stroke:'#fff', sw:1.6, halo:.32},
    core:  {fill:'url(#gLg)',     stroke:'var(--lilac)', sw:1.3, halo:.24},
    corner:{fill:'rgba(28,19,64,.96)', stroke:'var(--lilac)', sw:1.6, halo:.14},
    tailmed:{fill:'rgba(59,42,134,.95)', stroke:'var(--lilac)', sw:1.1, halo:.12},
    tailsm:{fill:'rgba(91,141,239,.85)', stroke:'rgba(199,180,255,.7)', sw:1, halo:.12},
    green: {fill:'rgba(60,150,120,.9)', stroke:'rgba(180,255,220,.7)', sw:1.1, halo:.14},
    money: {fill:'rgba(45,130,100,.95)', stroke:'#6FE3A6', sw:1.4, halo:.16},
    love:  {fill:'rgba(190,70,95,.95)', stroke:'#FF9EB2', sw:1.4, halo:.16},
    lmmid: {fill:'rgba(40,30,74,.96)', stroke:'var(--lilac)', sw:1, halo:.1},
    plain: {fill:'rgba(21,14,58,.96)', stroke:'rgba(199,180,255,.6)', sw:1, halo:.07}
  };
  nodes.forEach((n,i)=>{
    const g=el('g',{class:'node-hit'}); g.dataset.idx=i;
    const rad=sizeMap[n.size]; const v=V[n.variant]||V.plain;
    g.appendChild(el('circle',{cx:n.x,cy:n.y,r:rad+5,fill:'var(--glow)',opacity:v.halo}));
    g.appendChild(el('circle',{cx:n.x,cy:n.y,r:rad,fill:v.fill,stroke:v.stroke,'stroke-width':v.sw,class:'node-circ'}));
    const t=el('text',{x:n.x,y:n.y,class:'node-num',style:'font-size:'+numSize[n.size]+'px'}); t.textContent=n.val;
    g.appendChild(t);
    g.addEventListener('click',()=>selectNode(i));
    svg.appendChild(g);
  });

  // defs (gradientes)
  const defs=el('defs',{});
  defs.innerHTML='<radialGradient id="gLg" cx="50%" cy="40%" r="62%">'+
    '<stop offset="0%" stop-color="#C7B4FF"/><stop offset="55%" stop-color="#7B5BE0"/>'+
    '<stop offset="100%" stop-color="#3B2A86"/></radialGradient>'+
    '<radialGradient id="gCenter" cx="50%" cy="38%" r="66%">'+
    '<stop offset="0%" stop-color="#FFFFFF"/><stop offset="40%" stop-color="#C7B4FF"/>'+
    '<stop offset="100%" stop-color="#6A46D8"/></radialGradient>';
  svg.insertBefore(defs, svg.firstChild);

  window._nodes=nodes;
  renderZones(nodes);
}

/* ============ INTERAÇÃO ============ */
function selectNode(i){
  const n=window._nodes[i];
  document.querySelectorAll('.node-hit').forEach(g=>g.classList.toggle('active', g.dataset.idx==i));
  const a=ARCANOS[n.val];
  const d=document.getElementById('detail');
  d.innerHTML='<div class="arc-card">'+
    '<div class="arc-zone">'+n.zone+' · '+n.zsub+'</div>'+
    '<div class="arc-head">'+n.val+' · '+a[0]+'</div>'+
    '<div class="arc-sub">'+a[1]+'</div>'+
    '<p class="arc-body">'+a[2]+'</p></div>';
  d.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function renderZones(nodes){
  const principais=["Essência Central","Retrato Pessoal","Talento Interior","Missão Social",
    "Cauda Kármica","Linha do Amor","Linha do Dinheiro","Propósito Espiritual","Propósito Pessoal",
    "Ancestral Paterno","Ancestral Materno"];
  const grid=document.getElementById('zoneGrid'); grid.innerHTML="";
  principais.forEach(zn=>{
    const n=nodes.find(x=>x.zone===zn); if(!n||!ARCANOS[n.val])return;
    const a=ARCANOS[n.val];
    const item=document.createElement('div'); item.className='zone-item';
    item.innerHTML='<div class="zn">'+zn+'</div><div class="zv"><span class="num">'+n.val+'</span><span class="arc">'+a[0]+'</span></div>';
    item.addEventListener('click',()=>{
      const idx=nodes.indexOf(n); selectNode(idx);
      document.querySelector('.chart-shell').scrollIntoView({behavior:'smooth',block:'start'});
    });
    grid.appendChild(item);
  });
}

/* ============ FORM ============ */
function fill(sel,from,to,pad){
  const s=document.getElementById(sel);
  for(let i=from;i<=to;i++){const o=document.createElement('option'); o.value=i; o.textContent=pad?String(i).padStart(2,'0'):i; s.appendChild(o);}
}
fill('dia',1,31); fill('mes',1,12);
(function(){const s=document.getElementById('ano'); const y=new Date().getFullYear();
  for(let i=y;i>=1920;i--){const o=document.createElement('option'); o.value=i; o.textContent=i; s.appendChild(o);} })();

document.getElementById('go').addEventListener('click',()=>{
  const dia=+document.getElementById('dia').value, mes=+document.getElementById('mes').value, ano=+document.getElementById('ano').value;
  const err=document.getElementById('err');
  const dim=new Date(ano,mes,0).getDate();
  if(dia>dim){ err.textContent="Esse mês tem apenas "+dim+" dias. Ajuste a data para revelar o mapa."; return; }
  err.textContent="";
  const r=calcular(dia,mes,ano);
  const nome=document.getElementById('nome').value.trim();
  document.getElementById('rname').textContent = nome ? nome : "";
  document.getElementById('rtitle').textContent = nome ? "O octograma de "+nome.split(' ')[0] : "Seu octograma";
  render(r);
  const res=document.getElementById('result'); res.classList.add('show');
  document.getElementById('detail').innerHTML="";
  setTimeout(()=>res.scrollIntoView({behavior:'smooth',block:'start'}),80);
});

/* ============ CAMPO DE ESTRELAS ============ */
(function(){
  const c=document.getElementById('stars'), x=c.getContext('2d'); let w,h,stars;
  function init(){ w=c.width=innerWidth; h=c.height=innerHeight;
    stars=Array.from({length:Math.min(160,Math.floor(w*h/9000))},()=>({
      x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.3+.2,
      a:Math.random(), s:Math.random()*.02+.004 })); }
  function draw(){ x.clearRect(0,0,w,h);
    for(const st of stars){ st.a+=st.s; const o=.3+Math.abs(Math.sin(st.a))*.6;
      x.beginPath(); x.arc(st.x,st.y,st.r,0,7); x.fillStyle='rgba(220,210,255,'+o+')'; x.fill(); }
    requestAnimationFrame(draw); }
  init(); draw(); addEventListener('resize',init);
})();
</script>
